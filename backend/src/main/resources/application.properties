spring.application.name=daav-backend

# Development/Sandbox FX rate only. Replace this provider before production use.
daav.fx.tzs-per-usd=${FX_TZS_PER_USD:2500}
daav.fx.source=${FX_SOURCE:CONFIGURED_DEVELOPMENT_RATE}
daav.fx.paypal-currency-scale=${PAYPAL_CURRENCY_SCALE:2}
daav.fx.paypal-rounding-mode=${PAYPAL_ROUNDING_MODE:HALF_UP}

management.endpoints.web.exposure.include=health,info

spring.jpa.open-in-view=false
